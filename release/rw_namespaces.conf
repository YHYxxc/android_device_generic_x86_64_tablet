# Namespaces whose READ_ONLY aconfig flags aconfig/cp2a makes READ_WRITE (current state kept).
# One per line. After editing, or after a Lineage/AOSP bump, regenerate aconfig/<release>:
#
#   cd aosp-workspace
#   device/generic/x86_64_tablet/scripts/aconfig_inventory.py scan . cp2a -o /tmp/cp2a.csv \
#       --exclude-root device/generic/x86_64_tablet/release
#   device/generic/x86_64_tablet/scripts/aconfig_inventory.py rw-pack /tmp/cp2a.csv cp2a \
#       device/generic/x86_64_tablet/release/aconfig/cp2a \
#       --namespaces-file device/generic/x86_64_tablet/release/rw_namespaces.conf
#
# Flags in other namespaces are READ_WRITE too unless a release sets them READ_ONLY
# (RELEASE_ACONFIG_FLAG_DEFAULT_PERMISSION). is_fixed_read_only flags never are.
lse_desktop_experience
windowing_frontend
windowing_sdk
multitasking
window_surfaces
display_manager
large_screen_experiences_app_compat
launcher
systemui
input
